<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Crash before commit: the recovery path</title><desc id="desc">Claim and record attempt one. Worker dies before commit, leaving no effect. After the lease expires and backoff, attempt two claims with a new token. Effect and success commit together, leaving one committed local effect.</desc>
  <rect width="900" height="520" rx="18" fill="#f4f8fc"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#132d46"><text x="34" y="53" font-size="29" font-weight="700">A crash is a recorded event.</text><text x="34" y="87" font-size="20">Illustration of the tested crash-before-commit path</text></g>
  <g stroke="#bccddb" fill="#fff"><rect x="34" y="116" width="403" height="152" rx="12"/><rect x="463" y="116" width="403" height="152" rx="12"/><rect x="34" y="290" width="403" height="152" rx="12"/><rect x="463" y="290" width="403" height="152" rx="12"/></g>
  <g font-family="Segoe UI,Arial,sans-serif"><g font-size="17" font-weight="700" fill="#47647d"><text x="57" y="150">01 / CLAIM</text><text x="486" y="150">02 / CRASH</text><text x="57" y="324">03 / RECOVER</text><text x="486" y="324">04 / COMMIT</text></g><g font-size="24" font-weight="700" fill="#132d46"><text x="57" y="187">Attempt 1 starts</text><text x="486" y="187">Worker exits</text><text x="57" y="361">Attempt 2 starts</text><text x="486" y="361">One local effect</text></g><g font-size="19" fill="#47647d"><text x="57" y="220">Lease + token persisted</text><text x="486" y="220">No result committed</text><text x="57" y="394">Expired lease + backoff</text><text x="486" y="394">Effect + success: one transaction</text></g><text x="34" y="483" font-size="19" fill="#132d46">Execution may repeat. Committed demo effects do not.</text></g>
</svg>
